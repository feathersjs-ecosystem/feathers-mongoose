version: '3.8'

services:
  app-node12:
    platform: linux/arm64
    build:
      context: .
      dockerfile: Dockerfile.node12
    volumes:
      - .:/app:delegated
      - node_modules_node12:/app/node_modules:delegated
    environment:
      - NODE_ENV=test
      - MONGODB_URI=mongodb://mongo:27017/feathers-mongoose-test?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - test-network
    command: npm run mocha

  mongo:
    platform: linux/arm64
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_node12:/data/db
    networks:
      - test-network
    command: --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  node_modules_node12:
  mongodb_data_node12:

networks:
  test-network:
    driver: bridge